version: '3.8'

networks:
  aventra-network:
    driver: bridge

volumes:
  aventra-postgres-data:
    driver: local
  aventra-model-storage:
    driver: local

services:
  # 1. Enterprise PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aventra-postgres
    restart: unless-stopped
    networks:
      - aventra-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aventra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AventraSecureDBPass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-aventra_db}
    volumes:
      - aventra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aventra} -d ${POSTGRES_DB:-aventra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. AVENTRA Backend Core & ML Runtime
  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    container_name: aventra-backend
    restart: unless-stopped
    networks:
      - aventra-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aventra}:${POSTGRES_PASSWORD:-AventraSecureDBPass_2026!}@postgres:5432/${POSTGRES_DB:-aventra_db}
      SECRET_KEY: ${SECRET_KEY:-AVENTRA_SUPER_SECURE_ENTERPRISE_KEY_2026_PRODUCTION}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      PRICE_TOLERANCE_PCT: 2.0
      CONFIDENCE_THRESHOLD: 0.85
      DRIFT_SIMILARITY_THRESHOLD: 0.60
      AUTO_APPLY_DRIFT: "false"
    volumes:
      - aventra-model-storage:/app/ml/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 3. AVENTRA Frontend Web Console
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/frontend.Dockerfile
    container_name: aventra-frontend
    restart: unless-stopped
    networks:
      - aventra-network
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: /api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 4. Nginx Reverse Proxy & TLS Termination
  nginx:
    image: nginx:alpine
    container_name: aventra-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - aventra-network
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
