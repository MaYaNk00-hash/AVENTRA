events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream services
    upstream backend_svc {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_svc {
        server frontend:3000;
        keepalive 32;
    }

    # HTTP Server -> Redirect all to HTTPS
    server {
        listen 80;
        server_name _;

        location /.well-known/health {
            return 200 "OK\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (TLS Termination)
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/aventra.crt;
        ssl_certificate_key /etc/nginx/certs/aventra.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API & SSE Stream Routing
        location /api/ {
            proxy_pass http://backend_svc;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events (SSE) & WebSocket configurations
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # OpenAPI Docs
        location /docs {
            proxy_pass http://backend_svc;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend_svc;
            proxy_set_header Host $host;
        }

        # Frontend Next.js Web Application
        location / {
            proxy_pass http://frontend_svc;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
